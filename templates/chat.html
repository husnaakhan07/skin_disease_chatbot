<!DOCTYPE html>
<html>
<head>
    <title>Medical AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add Markdown CSS and library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .chat-card {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            background: #111111;
            color: #ffffff;
            padding: 20px 24px;
            font-size: 1.4rem;
            font-weight: 600;
            border-bottom: 1px solid #333333;
            letter-spacing: 0.5px;
        }

        .chat-header i {
            color: #007bff;
            margin-right: 12px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #000000;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #111111;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        .msg_container {
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: #007bff;
            color: white;
            border-radius: 18px 18px 5px 18px;
            padding: 14px 18px;
            margin-left: auto;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-message-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-message-text {
            margin: 0;
        }

        .bot-msg {
            color: #ffffff;
        }

        /* Image styles */
        .chat-image-container {
            max-width: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333333;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            background: #1a1a1a;
            margin: 5px 0;
        }

        .user-msg .chat-image-container {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .bot-msg .chat-image-container {
            border-color: #007bff;
        }

        .chat-image-container:hover {
            transform: scale(1.02);
            border-color: #007bff;
        }

        .chat-thumbnail {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Modal styles */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            overflow: auto;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.3);
            border: 2px solid #007bff;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 10001;
        }

        .close-modal:hover {
            color: #007bff;
        }

        /* Image preview before sending */
        .image-preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid #333333;
        }

        .preview-thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #007bff;
        }

        .preview-info {
            flex: 1;
            color: #cccccc;
            font-size: 0.9rem;
        }

        .remove-image-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .remove-image-btn:hover {
            background: #ff4444;
            color: white;
        }

        /* Markdown styling */
        .markdown-body {
            background: #111111;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            padding: 18px 22px;
            border-radius: 18px 18px 18px 5px;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            color: #ffffff;
            margin: 16px 0 8px 0;
            font-weight: 600;
        }

        .markdown-body h1 { font-size: 1.8rem; border-bottom: 1px solid #333333; padding-bottom: 8px; }
        .markdown-body h2 { font-size: 1.5rem; }
        .markdown-body h3 { font-size: 1.3rem; }
        .markdown-body h4 { font-size: 1.1rem; }

        .markdown-body p {
            margin: 10px 0;
            color: #e0e0e0;
        }

        /* IMPORTANT: Yellow highlighting for key terms - like you wanted! */
        .markdown-body strong {
            color: #ffd700;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Hover effect - invert colors on important terms */
        .markdown-body strong:hover {
            color: #000000;
            background-color: #ffd700;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .markdown-body em {
            color: #00ff88;
            transition: all 0.2s ease;
        }

        .markdown-body em:hover {
            color: #000000;
            background-color: #00ff88;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 10px 0;
            padding-left: 25px;
            color: #e0e0e0;
        }

        .markdown-body li {
            margin: 6px 0;
        }

        .markdown-body li::marker {
            color: #007bff;
        }

        /* Table styling - Black text for readability */
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #cccccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .markdown-body th {
            background: #f0f0f0;
            color: #000000;
            font-weight: 700;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid #007bff;
            font-size: 1.05rem;
        }

        .markdown-body td {
            padding: 12px 16px;
            border-bottom: 1px solid #dddddd;
            color: #000000;
            font-weight: 500;
            background-color: #ffffff;
        }

        /* Make ALL table content black */
        .markdown-body td,
        .markdown-body td ul,
        .markdown-body td ol,
        .markdown-body td p,
        .markdown-body td li,
        .markdown-body td span,
        .markdown-body td div {
            color: #000000;
        }

        /* Style for bullet points in tables */
        .markdown-body td ul {
            padding-left: 20px;
            margin: 4px 0;
        }

        .markdown-body td li {
            color: #000000;
            margin-bottom: 4px;
        }

        .markdown-body td li::marker {
            color: #007bff;
            font-size: 1.2em;
        }

        /* Style for page references and citations */
        .markdown-body td em {
            color: #333333;
            font-style: italic;
        }

        /* Keep yellow highlighting for strong tags INSIDE tables too */
        .markdown-body td strong {
            color: #ffd700 !important;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .markdown-body td strong:hover {
            color: #000000 !important;
            background-color: #ffd700;
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Row striping for better readability */
        .markdown-body tr:nth-child(even) td {
            background-color: #f8f8f8;
        }

        .markdown-body tr:hover td {
            background-color: #e6f2ff;
        }

        .markdown-body tr:last-child td {
            border-bottom: none;
        }

        /* Make headers in tables stand out */
        .markdown-body td strong {
            color: #ffd700;
            font-weight: 700;
        }

        /* Special styling for medication names in tables */
        .markdown-body td:last-child strong {
            color: #ffd700;
        }

        /* Table note styling */
        .markdown-body table + p,
        .markdown-body table + em {
            color: #cccccc;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        /* Audio player */
        audio {
            width: 100%;
            margin-top: 12px;
            border-radius: 30px;
            background: #111111;
        }

        audio::-webkit-media-controls-panel {
            background: #222222;
        }

        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #ffffff;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            padding: 16px 22px;
            background: #111111;
            border-radius: 18px 18px 18px 5px;
            width: fit-content;
            border: 1px solid #222222;
        }

        .typing-indicator span {
            height: 10px;
            width: 10px;
            background: #007bff;
            border-radius: 50%;
            display: inline-block;
            margin: 0 3px;
            animation: typing 1.4s infinite;
            opacity: 0.7;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-12px); opacity: 1; }
        }

        /* Input area */
        .input-group {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            background: #111111;
            border-top: 1px solid #333333;
            gap: 12px;
            flex-wrap: wrap;
        }

        #textInput {
            flex: 1;
            min-width: 200px;
            background: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        #textInput:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        #textInput::placeholder {
            color: #666666;
        }

        .icon-btn {
            background: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: #007bff;
            border-color: #007bff;
            transform: scale(1.05);
        }

        .icon-btn.speaking {
            background: #ff4444;
            border-color: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #imageInput {
            display: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .chat-card {
                width: 100%;
                height: 95vh;
            }
            
            .msg_container {
                max-width: 95%;
            }
            
            .input-group {
                padding: 15px;
            }
            
            .icon-btn {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }

            .chat-image-container {
                max-width: 150px;
            }
        }

        /* Special styling for warning messages */
        .markdown-body .warning {
            color: #ff6b6b;
            background: #2a0000;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
            margin: 16px 0;
        }

        /* Code blocks if any */
        .markdown-body pre {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #333333;
            overflow-x: auto;
        }

        .markdown-body code {
            background: #1a1a1a;
            color: #00ff88;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Blockquotes */
        .markdown-body blockquote {
            border-left: 4px solid #007bff;
            padding: 8px 16px;
            background: #1a1a1a;
            margin: 16px 0;
            color: #cccccc;
        }

        .top-result {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">
            <i class="fas fa-hand-holding-medical"></i> MEDICAL AI ASSISTANT
        </div>
        
        <div id="messageFormeight" class="chat-messages">
            <div class="msg_container bot-msg">
                <div class="markdown-body">
                    Hello! I am your AI medical assistant. You can type a question, upload a photo of a symptom, or use your voice.
                </div>
            </div>
        </div>

        <!-- Image preview area -->
        <div id="imagePreviewArea" class="image-preview-container" style="display: none; margin: 0 24px 10px 24px;">
            <img id="previewImage" class="preview-thumbnail" src="#" alt="Preview">
            <div class="preview-info">
                <span id="previewFileName"></span>
            </div>
            <button id="removeImageBtn" class="remove-image-btn">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="input-group">
            <label for="imageInput" class="icon-btn" title="Upload image">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="imageInput" accept="image/*">

            <input type="text" id="textInput" placeholder="Describe symptoms or ask about the image..." autocomplete="off">
            
            <button id="muteBtn" class="icon-btn" title="Mute audio">
                <i id="muteIcon" class="fa-solid fa-volume-high"></i>
            </button>

            <button id="voiceBtn" class="icon-btn" title="Voice input">
                <i class="fas fa-microphone"></i>
            </button>

            <button id="sendBtn" class="icon-btn" title="Send message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const voiceBtn = document.getElementById('voiceBtn');
        const textInput = document.getElementById('textInput');
        const muteInput = document.getElementById('muteBtn');
        const imageInput = document.getElementById('imageInput');
        const messageContainer = document.getElementById('messageFormeight');
        const imagePreviewArea = document.getElementById('imagePreviewArea');
        const previewImage = document.getElementById('previewImage');
        const previewFileName = document.getElementById('previewFileName');
        const removeImageBtn = document.getElementById('removeImageBtn');

        let currentImageFile = null;

        // Configure marked for better rendering
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false,
            highlight: function(code) {
                return code;
            }
        });

        // --- 1. VOICE RECORDING ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.classList.add('speaking');
                voiceBtn.innerHTML = '<i class="fas fa-microphone-alt"></i>';
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                voiceBtn.classList.remove('speaking');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                // Don't auto-send, let user review first
            };

            recognition.onerror = () => {
                voiceBtn.classList.remove('speaking');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            };
            
            recognition.onend = () => {
                voiceBtn.classList.remove('speaking');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            };
        } else {
            voiceBtn.style.display = 'none';
        }

        // --- 2. IMAGE HANDLING ---
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                handleImageSelection(file);
            }
        });

        // Handle paste events for images
        document.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    handleImageSelection(file);
                    break;
                }
            }
        });

        function handleImageSelection(file) {
            currentImageFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                previewFileName.textContent = file.name;
                imagePreviewArea.style.display = 'flex';
                
                // Update placeholder
                textInput.placeholder = "Ask about this image or describe symptoms...";
            }
            reader.readAsDataURL(file);
        }

        removeImageBtn.addEventListener('click', function() {
            clearImageSelection();
        });

        function clearImageSelection() {
            currentImageFile = null;
            imageInput.value = '';
            imagePreviewArea.style.display = 'none';
            previewImage.src = '#';
            previewFileName.textContent = '';
            textInput.placeholder = "Describe symptoms or ask about the image...";
        }

        // --- 3. TYPING INDICATOR ---
        function showTypingIndicator() {
            const typingHtml = `
                <div class="msg_container bot-msg" id="typingIndicator">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            $("#messageFormeight").append(typingHtml);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            $("#typingIndicator").remove();
        }

        function scrollToBottom() {
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // --- 4. MODAL FOR FULL IMAGE VIEW ---
        function showFullImage(src) {
            // Remove any existing modal
            $('.image-modal').remove();
            
            const modal = `
                <div class="image-modal" onclick="this.style.display='none'">
                    <span class="close-modal" onclick="this.parentElement.style.display='none'">&times;</span>
                    <img class="modal-content" src="${src}" alt="Full size image">
                </div>
            `;
            $('body').append(modal);
            $('.image-modal').fadeIn(300);
            
            // Close on escape key
            $(document).on('keydown', function(e) {
                if (e.key === 'Escape') {
                    $('.image-modal').fadeOut(300, function() {
                        $(this).remove();
                    });
                }
            });
        }

        // --- 5. DISPLAY MESSAGES ---
        function displayUserMessage(text, imageFile) {
            let messageHtml = '<div class="msg_container user-msg"><div class="user-message-content">';
            
            if (text) {
                messageHtml += `<div class="user-message-text">${escapeHtml(text)}</div>`;
            }
            
            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgHtml = `
                        <div class="chat-image-container" onclick="showFullImage('${e.target.result}')">
                            <img src="${e.target.result}" class="chat-thumbnail" alt="Uploaded image">
                        </div>
                    `;
                    // Append to the last user message
                    $('.user-msg:last .user-message-content').append(imgHtml);
                    scrollToBottom();
                }
                reader.readAsDataURL(imageFile);
            }
            
            messageHtml += '</div></div>';
            $("#messageFormeight").append(messageHtml);
            scrollToBottom();
        }

        function displayBotMessage(response, imageUrl) {
            let botHtml = '<div class="msg_container bot-msg"><div class="markdown-body">';
            
            // If there's an image from the server, show it
            if (imageUrl) {
                botHtml += `
                    <div class="chat-image-container" onclick="showFullImage('${imageUrl}')">
                        <img src="${imageUrl}" class="chat-thumbnail" alt="Uploaded image">
                    </div>
                    <br>
                `;
            }
            
            // Parse markdown for the response
            botHtml += marked.parse(response || "No response received");
            botHtml += '</div></div>';
            
            $("#messageFormeight").append(botHtml);
            scrollToBottom();
        }

        // --- 6. SEND MESSAGE ---
        function sendMessage() {
            const msg = textInput.value.trim();
            
            if (!msg && !currentImageFile) return;

            // Display user message immediately
            displayUserMessage(msg, currentImageFile);
            
            // Clear input
            textInput.value = "";
            const tempImageFile = currentImageFile;
            clearImageSelection();
            
            scrollToBottom();
            showTypingIndicator();

            const formData = new FormData();
            formData.append("msg", msg || "");
            if (tempImageFile) {
                formData.append("image", tempImageFile);
            }

            $.ajax({
                type: "POST",
                url: "/get",
                data: formData,
                processData: false,
                contentType: false,
                timeout: 60000,
                success: function(data) {
                    removeTypingIndicator();
                    
                    // Display bot response with any returned image
                    displayBotMessage(data.answer, data.image_url);

                    // Auto-play audio
                    if (data.audio_url) {
                        const audio = new Audio(data.audio_url);
                        audio.play().catch(e => console.log('Audio playback failed:', e));
                    }

                    scrollToBottom();
                },
                error: function(xhr, status, error) {
                    removeTypingIndicator();
                    
                    const errorHtml = `
                        <div class="msg_container bot-msg">
                            <div class="markdown-body" style="color: #ff6b6b;">
                                Sorry, I encountered an error. Please try again.
                            </div>
                        </div>
                    `;
                    $("#messageFormeight").append(errorHtml);
                    scrollToBottom();
                }
            });
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Event listeners
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        
        textInput.addEventListener('keypress', (e) => { 
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(); 
            }
        });

        // Mute button
        function updateMute(){
            let mute = false;
            icon = document.getElementById('muteIcon');
            if (icon.className == "fa-solid fa-volume-high") {
                icon.className = "fa-solid fa-volume-xmark";
                mute = true;
            }
            else {
                icon.className = "fa-solid fa-volume-high";
                mute = false;
            }
            // Send update
            $.ajax({
                type: "POST",
                url: "/mute",
                contentType: 'application/json',
                data: JSON.stringify({ 'isActive': mute }),
                success: function(response) {
                    console.log("Success:", response);
                },
                error: function(error) {
                    console.log("Error:", error);
                }
            });

        }
        muteBtn.addEventListener('click', updateMute);

        // Make showFullImage globally available
        window.showFullImage = showFullImage;

        scrollToBottom();
    </script>
</body>
</html>
