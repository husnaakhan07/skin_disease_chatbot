<!DOCTYPE html>
<html>
<head>
    <title>Medical AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">
            <i class="fas fa-hand-holding-medical"></i> MEDICAL AI ASSISTANT
        </div>
        
        <div id="messageFormeight">
            <div class="msg_container bot-msg">
                Hello! I am your AI medical assistant. You can type a question, upload a photo of a symptom, or use your voice.
            </div>
        </div>

        <div class="input-group">
            <label for="imageInput" class="icon-btn">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="imageInput" accept="image/*">

            <input type="text" id="textInput" placeholder="Describe symptoms...">

            <button id="voiceBtn" class="icon-btn">
                <i class="fas fa-microphone"></i>
            </button>

            <button id="sendBtn" class="icon-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const voiceBtn = document.getElementById('voiceBtn');
        const textInput = document.getElementById('textInput');
        const imageInput = document.getElementById('imageInput');

        // --- 1. VOICE RECORDING (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.classList.add('speaking'); // Trigger CSS pulse
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                voiceBtn.classList.remove('speaking');
                sendMessage(); // Auto-send after voice recognition
            };

            recognition.onerror = () => voiceBtn.classList.remove('speaking');
        }

        // --- 2. SEND MESSAGE LOGIC ---
        function sendMessage() {
            const msg = textInput.value;
            const file = imageInput.files[0];

            if (!msg && !file) return;

            // Append User Message to UI
            const userHtml = `<div class="msg_container user-msg">${msg || "Sent an image..."}</div>`;
            $("#messageFormeight").append(userHtml);
            textInput.value = "";

            // Prepare Form Data
            const formData = new FormData();
            formData.append("msg", msg);
            if (file) formData.append("image", file);

            // AJAX Request to Flask
            $.ajax({
                type: "POST",
                url: "/get",
                data: formData,
                processData: false,
                contentType: false,
                success: function(data) {
                    // Append Bot Response
                    const botHtml = `<div class="msg_container bot-msg">${data.answer}</div>`;
                    $("#messageFormeight").append(botHtml);

                    // Auto-play Groq TTS Audio
                    if (data.audio_url) {
                        const audio = new Audio(data.audio_url);
                        audio.play();
                    }

                    // Scroll to bottom
                    $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                    imageInput.value = ""; // Clear file input
                }
            });
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        textInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
